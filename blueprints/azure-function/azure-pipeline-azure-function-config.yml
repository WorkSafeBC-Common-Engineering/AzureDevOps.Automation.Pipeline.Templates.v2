# -----------------------------------------------------------------------------------------------------
#
# If you are not going to use all stages, as below, you can suppress them by setting active to false.
#
# Need help with the configuration?
#
# -VARIABLE ---------- VALUE ------
# *Active              true or false. To disable or hide a stage, set value to false.
# *EnvName             See https://dev.azure.com/<__AzDO_ORG__>/<__AzDO_PROJECT__>/_environments
#                      Format: <portfolio>-<stage-name>-<stage-name-acronym>, for example
#                      assessments-development-dv
# *VmImage             ubuntu-latest, windows-latest, 
#                      or see https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/hosted
# *other*              Contact your Delivery CSE.
# <portfolio>          Replace with your Azure DevOps portfolio name, matching ServiceNow.
#
# -----------------------------------------------------------------------------------------------------

# -----------------------------------------------------------------------------------------------------
# Continuous Integration Stage
#- name:  ciStagePool
#  value: '<TBD>'   # e.g. "Azure Pipeline" or other agent pool name (default is "Azure Pipeline")
