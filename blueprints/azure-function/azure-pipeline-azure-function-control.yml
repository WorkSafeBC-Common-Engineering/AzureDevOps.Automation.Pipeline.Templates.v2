parameters:
# Do NOT modify this baseline version. Use a higher version in the -start.yml template for newer features.
- name:     blueprintVersion
  type:     string
  default:  2.0.0
- name:     netCoreVersion
  type:     string
- name:     portfolioName
  type:     string
- name:     productName
  type:     string
- name:     applicationBlueprint
  type:     string
  default:  'azure-function'
- name:     azFuncProjectName
  type:     string
  default:  '*' # TODO: to be removed once this parameter is not optional
- name:     azureFunctionType
  type:     string
  default:  'functionAppLinux'
- name:     modeElite
  type:     boolean
  default:  true
# Bootstrap optionals
- name:     verbose
  type:     boolean
  default:  false
# CI Blueprint optionals
- name:     versionSpec
  type:     string
  default:  '5.11.x' # switch from 5.6.3 to 5.11.x as default
# CD Blueprint optionals
- name:     suppressCD
  type:     boolean
  default:  false
  
# VARIABLES
variables:
- ${{ if and( ne(parameters.suppressCD, true), eq(parameters.blueprintVersion, '2.0.0') ) }}:
  - template: /deploy/${{ lower(parameters.portfolioName) }}.${{ lower(parameters.productName) }}-config.yml@self

- ${{ if and( ne(parameters.suppressCD, true), ge(parameters.blueprintVersion, '2.1.0') ) }}:
  - template: /deploy/${{ lower(parameters.portfolioName) }}-${{ lower(parameters.productName) }}-config.yml@self

# -----------------------------------------------------------------------------------------------------
# Azure Function App Settings
# These are set for the current LTS supported versions of .Net and current Azure Function Runtime.
# NOTE: when we move to .Net 8 (LTS) and running the function in isolation mode,
#       we will need to adjust these settings. .Net 8 only supports isolated mode.
# -----------------------------------------------------------------------------------------------------
- name:  fxnExtensionVersion
  value: '~4'

- ${{ if or(eq(parameters.netCoreVersion, '6.x'), eq(parameters.netCoreVersion, '6.0.x')) }}:
  - name:  windowsDotNetVersion
    value: 'v6.0'
  - name:  linuxDotNetVersion
    value: 'DOTNET|6.0'

- ${{ if or(eq(parameters.netCoreVersion, '8.x'), eq(parameters.netCoreVersion, '8.0.x')) }}:
  - name:  windowsDotNetVersion
    value: 'v8.0'
  - name:  linuxDotNetVersion
    value: 'DOTNET-ISOLATED|8.0'

- ${{ if or(eq(parameters.netCoreVersion, '10.x'), eq(parameters.netCoreVersion, '10.0.x')) }}:
  - name:  windowsDotNetVersion
    value: 'v10.0'
  - name:  linuxDotNetVersion
    value: 'DOTNET-ISOLATED|10.0'

stages:
# --------------------------------------------------------------------------
# START OF PIPELINE
# --------------------------------------------------------------------------
- template: /blueprints/azure-function/azure-pipeline-azure-function-ci.yml@CeBlueprints
  parameters:
    blueprintVersion:     ${{parameters.blueprintVersion}}
    netCoreVersion:       ${{parameters.netCoreVersion}}
    portfolioName:        ${{parameters.portfolioName}}
    productName:          ${{parameters.productName}}
    applicationBlueprint: ${{parameters.applicationBlueprint}}
    azFuncProjectName:    ${{parameters.azFuncProjectName}}
    verbose:              ${{parameters.verbose}}
    modeElite:            ${{parameters.modeElite}}
    versionSpec:          ${{parameters.versionSpec}}
    jobPool:              ${{coalesce(variables.ciStagePool, 'Azure Pipelines')}}
    vmImage:              ${{coalesce(variables.ciStageVmImage, 'ubuntu-latest')}}    

# --------------------------------------------------------------------------
# DEPLOYMENT
# 2021.10.04 WS Suppress CD on "merge" so that we can use PR validation builds
# --------------------------------------------------------------------------
- ${{ if and(ne(parameters.suppressCD, true), ne(lower(variables['Build.SourceBranchName']), 'merge')) }}:
  - template: /blueprints/azure-function/azure-pipeline-azure-function-cd.yml@CeBlueprints
    parameters:
      azFuncProjectName:                  ${{parameters.azFuncProjectName}}
      azureFunctionType:                  ${{parameters.azureFunctionType}}
      functionExtensionVersion:           ${{variables.fxnExtensionVersion}}
      linuxRuntimeStack:                  ${{variables.linuxDotNetVersion}}
      windowsRuntimeStack:                ${{variables.windowsDotNetVersion}}

      stage:
        development:
          config:
            active:                       ${{variables.developmentStageActive}}
            envName:                      ${{variables.developmentStageEnvName}}
            namePool:                     ${{coalesce(variables.developmentStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.developmentStageVmImage, 'ubuntu-latest')}}
            azureSubscription:            ${{variables.developmentStageAzRmWebDeployAzureSubscription}}
            azureResourceGroup:           ${{variables.developmentStageAzResourceGroup}}
            azureAppName:                 ${{variables.developmentStageAzRmWebDeployWebAppName}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}  
          blueprintVersion:               ${{parameters.blueprintVersion}}     
          modeElite:                      ${{parameters.modeElite}}

        systemTest:
          config:
            active:                       ${{variables.systemTestStageActive}}
            envName:                      ${{variables.systemTestStageEnvName}}
            namePool:                     ${{coalesce(variables.systemTestStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.systemTestStageVmImage, 'ubuntu-latest')}}
            azureSubscription:            ${{variables.systemTestStageAzRmWebDeployAzureSubscription}}
            azureResourceGroup:           ${{variables.systemTestStageAzResourceGroup}}
            azureAppName:                 ${{variables.systemTestStageAzRmWebDeployWebAppName}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}  
          blueprintVersion:               ${{parameters.blueprintVersion}}     
          modeElite:                      ${{parameters.modeElite}}

        staging:
          config:
            active:                       ${{variables.stagingStageActive}}
            envName:                      ${{variables.stagingStageEnvName}}
            namePool:                     ${{coalesce(variables.stagingStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.stagingStageVmImage, 'ubuntu-latest')}}
            azureSubscription:            ${{variables.stagingStageAzRmWebDeployAzureSubscription}}
            azureResourceGroup:           ${{variables.stagingStageAzResourceGroup}}
            azureAppName:                 ${{variables.stagingStageAzRmWebDeployWebAppName}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}  
          blueprintVersion:               ${{parameters.blueprintVersion}}     
          modeElite:                      ${{parameters.modeElite}}

        production:
          config:
            active:                       ${{variables.productionStageActive}}
            envName:                      ${{variables.productionStageEnvName}}
            namePool:                     ${{coalesce(variables.productionStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.productionStageVmImage, 'ubuntu-latest')}}
            azureSubscription:            ${{variables.productionStageAzRmWebDeployAzureSubscription}}
            azureResourceGroup:           ${{variables.productionStageAzResourceGroup}}
            azureAppName:                 ${{variables.productionStageAzRmWebDeployWebAppName}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}
          blueprintVersion:               ${{parameters.blueprintVersion}}
          modeElite:                      ${{parameters.modeElite}}

        productionCanadaCentral:
          config:
            active:                       ${{variables.productionCanadaCentralStageActive}}
            envName:                      ${{variables.productionCanadaCentralStageEnvName}}
            namePool:                     ${{coalesce(variables.productionCanadaCentralStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.productionCanadaCentralStageVmImage, 'ubuntu-latest')}}
            azureSubscription:            ${{variables.productionCanadaCentralStageAzRmWebDeployAzureSubscription}}
            azureResourceGroup:           ${{variables.productionCanadaCentralStageAzResourceGroup}}
            azureAppName:                 ${{variables.productionCanadaCentralStageAzRmWebDeployWebAppName}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}
          blueprintVersion:               ${{parameters.blueprintVersion}}
          modeElite:                      ${{parameters.modeElite}}

        productionCanadaEast:
          config:
            active:                       ${{variables.productionCanadaEastStageActive}}
            envName:                      ${{variables.productionCanadaEastStageEnvName}}
            namePool:                     ${{coalesce(variables.productionCanadaEastStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.productionCanadaEastStageVmImage, 'ubuntu-latest')}}
            azureSubscription:            ${{variables.productionCanadaEastStageAzRmWebDeployAzureSubscription}}
            azureResourceGroup:           ${{variables.productionCanadaEastStageAzResourceGroup}}
            azureAppName:                 ${{variables.productionCanadaEastStageAzRmWebDeployWebAppName}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}
          blueprintVersion:               ${{parameters.blueprintVersion}}
          modeElite:                      ${{parameters.modeElite}}

        # Embedded non-negotiable stages ------------------------------------
        securityReview:
          config:
            envName:                      ${{variables.securityReviewStageEnvName}}
            namePool:                     ${{coalesce(variables.securityReviewStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.securityReviewStageVmImage, 'ubuntu-latest')}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}
          blueprintVersion:               ${{parameters.blueprintVersion}}
          modeElite:                      ${{parameters.modeElite}}
        securityAutomation:
          config:
            namePool:                     ${{coalesce(variables.securityAutomationStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.securityAutomationStageVmImage, 'ubuntu-latest')}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}
          blueprintVersion:               ${{parameters.blueprintVersion}}
          modeElite:                      ${{parameters.modeElite}}
        qaAutomation:
          config:
            namePool:                     ${{coalesce(variables.qaAutomationStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.qaAutomationStageVmImage, 'ubuntu-latest')}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}
          blueprintVersion:               ${{parameters.blueprintVersion}}
          modeElite:                      ${{parameters.modeElite}}
        preProdAutomation:
          config:
            namePool:                     ${{coalesce(variables.preProdAutomationStagePool, 'Azure Pipelines')}}
            nameVM:                       ${{coalesce(variables.preProdAutomationStageVmImage, 'ubuntu-latest')}}
          applicationBlueprint:           ${{parameters.applicationBlueprint}}
          blueprintVersion:               ${{parameters.blueprintVersion}}
          modeElite:                      ${{parameters.modeElite}}

# --------------------------------------------------------------------------
# END OF PIPELINE
# --------------------------------------------------------------------------