parameters:
- name:     name
  type:     string
- name:     displayName
  type:     string
- name:     blueprintVersion
  type:     string
- name:     netCoreVersion
  type:     string
- name:     vmImage
  type:     string
- name:     config
  type:     object
  default:  []
- name:     dependsOn
  type:     object
  default:  []

stages:

# -----------------------------------------------------------------------------------------------------
# STAGE
# -----------------------------------------------------------------------------------------------------

- stage:         ${{parameters.name}}
  displayName:   ${{parameters.displayName}}
  ${{ if ne(length(parameters.dependsOn), 0) }}:
    dependsOn:
      - ${{ each stage in parameters.dependsOn }}:
        - ${{stage}}

  variables:
      currentVersion: $[ stageDependencies.ContinuousIntegration.ContinuousIntegration.outputs['setSemVersion.semVersion'] ]

      # Map netCoreVersion to Azure linux-fx-version and net-framework-version formats
      ${{ if eq(parameters.netCoreVersion, '10.x') }}:
        linuxFxVersion: 'DOTNETCORE|10.0'
        windowsFxVersion: 'v10.0'
      ${{ elseif eq(parameters.netCoreVersion, '8.x') }}:
        linuxFxVersion: 'DOTNETCORE|8.0'
        windowsFxVersion: 'v8.0'
      ${{ else }}:
        linuxFxVersion: 'DOTNETCORE|8.0'
        windowsFxVersion: 'v8.0'

  ${{ if ne(parameters.config.nameVM, '') }}: #910188
    pool:
      name:      ${{parameters.config.namePool}}
      vmImage:   ${{parameters.config.nameVM}}
  ${{ else }}:
    pool:
      name:      ${{parameters.config.namePool}}
      
  jobs:
  - deployment:  ${{parameters.name}}
    environment: ${{parameters.config.envName}}
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - ${{ if ge(parameters.blueprintVersion, '2.1.0') }}:
            - task: AzureCLI@2
              displayName: 'Discover Resource Group'            
              inputs:
                azureSubscription: ${{parameters.config.azureSubscription}}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  RESOURCE_GROUP=$(az webapp list --query "[?name=='${{parameters.config.appName}}'].resourceGroup" -o tsv)
                  echo "##vso[task.setvariable variable=resourceGroup]$RESOURCE_GROUP"
                  echo "Found resource group: $RESOURCE_GROUP"

          - ${{ if ge(parameters.blueprintVersion, '2.1.0') }}:
            - task: AzureCLI@2
              displayName: 'Configure Web App Runtime'
              inputs:
                azureSubscription: ${{parameters.config.azureSubscription}}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  if [[ "${{parameters.vmImage}}" == "windows-latest" ]]; then
                    az webapp config set \
                      --resource-group $(resourceGroup) \
                      --name ${{parameters.config.appName}} \
                      --net-framework-version "$(windowsFxVersion)" \
                      --debug
                  else
                    az webapp config set \
                      --resource-group $(resourceGroup) \
                      --name ${{parameters.config.appName}} \
                      --linux-fx-version "$(linuxFxVersion)" \
                      --debug
                  fi

          - task: AzureWebApp@1
            displayName: 'Azure Web App Deployment'
            inputs:
              azureSubscription: ${{parameters.config.azureSubscription}}
              appName: ${{parameters.config.appName}}
              appType: ${{parameters.config.appType}}
              package: $(Pipeline.Workspace)/drop/*.zip